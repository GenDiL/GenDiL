name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so this runs a
# subset of the CUDA tests on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator has no timing
# model and cannot reproduce hardware-specific behavior, so it complements
# real-GPU testing and does not replace it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "include/**"
      - "tests/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Device tests (CUDA 13.0 and simulated H100)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      # Device unit tests that do not need MFEM, HYPRE or the vendor sparse
      # libraries.
      TESTS: test-atomic-add test-kernel-loop test-vector-access test-csr-device-apply test-coo-device-apply test-csc-device-apply test-bsr-device-apply test-device-kernel-configuration test-threaded-dot-shared-arena

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@a1b9d4237411f9b2b0e0bb895b4d83377f336a7b # v0.1.9
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"
          # The library links the toolkit's cuSPARSE.
          library-path: "false"

      # 90-virtual embeds PTX only, which the simulator runs. The simulator
      # needs a shared CUDA runtime.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=90-virtual \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared

      - name: Build
        run: vgpu run --preload cmake --build build -j3 --target $TESTS

      # ctest hides the output of passing tests, so -V is used to see it.
      # Every listed test must be registered, must run under the simulator and
      # must pass. These tests print "skipped" or "not enabled" when the
      # device code is compiled out, and that counts as a failure here.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          regex="^($(echo $TESTS | tr ' ' '|'))\$"
          vgpu run ctest --test-dir build -V --output-on-failure --no-tests=error -R "$regex" | tee ctest.log
          grep -q "100% tests passed, 0 tests failed out of $(echo $TESTS | wc -w)" ctest.log
          grep -q "virtual GPU platform initialized: 1 x nvidia/h100" ctest.log
          if grep -Ei "\*\*\*(Failed|Skipped|Not Run)|CUDA error|VirtualGPU error|skipped|not enabled" ctest.log; then
            echo "::error::a test failed, was skipped or did not run on the device"
            exit 1
          fi
